services:
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DB_BACKEND: mongodb
      MONGODB_URI: mongodb://mongo:27017
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend-data:/project/backend/data
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo-data:
  backend-data:
